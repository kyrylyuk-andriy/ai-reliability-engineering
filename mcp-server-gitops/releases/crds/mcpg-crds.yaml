apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpgovernancepolicies.governance.mcp.io
spec:
  group: governance.mcp.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                requireAgentGateway:
                  type: boolean
                  default: true
                requireCORS:
                  type: boolean
                  default: true
                requireJWTAuth:
                  type: boolean
                  default: true
                requireRBAC:
                  type: boolean
                  default: true
                requirePromptGuard:
                  type: boolean
                  default: true
                requireTLS:
                  type: boolean
                  default: true
                requireRateLimit:
                  type: boolean
                  default: true
                scanInterval:
                  type: string
                  default: "5m"
                maxToolsWarning:
                  type: integer
                  default: 10
                maxToolsCritical:
                  type: integer
                  default: 15
                scoringWeights:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                severityPenalties:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                verifiedCatalogScoring:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                targetNamespaces:
                  type: array
                  items:
                    type: string
                excludeNamespaces:
                  type: array
                  items:
                    type: string
                aiAgent:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                requireHardenedDeployment:
                  type: boolean
                  default: false
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
  scope: Cluster
  names:
    plural: mcpgovernancepolicies
    singular: mcpgovernancepolicy
    kind: MCPGovernancePolicy
    shortNames:
      - mgp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: governanceevaluations.governance.mcp.io
spec:
  group: governance.mcp.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                policyRef:
                  type: string
                evaluationScope:
                  type: string
                  enum: ["cluster", "namespace"]
                  default: "cluster"
                targetNamespace:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
  scope: Cluster
  names:
    plural: governanceevaluations
    singular: governanceevaluation
    kind: GovernanceEvaluation
    shortNames:
      - geval
